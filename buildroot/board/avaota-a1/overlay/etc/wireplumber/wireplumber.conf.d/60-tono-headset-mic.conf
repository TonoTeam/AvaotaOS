# A1 wires MIC3. The BSP FIFO channel count follows the enabled ADCs.
# WirePlumber 0.5 form of the established 0.4 mono capture workaround.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_input.platform-soc_3000000_codec_mach.stereo-fallback"
      }
    ]
    actions = {
      update-props = {
        audio.channels = 1
        audio.position = [ MONO ]
        node.description = "Avaota A1 Headset Microphone"
      }
    }
  }
]
