[Unit]
Wants=user@1000.service tono-grow-rootfs.service tono-kiosk-power.service
After=user@1000.service tono-grow-rootfs.service tono-kiosk-power.service

[Service]
Environment=HOME=/home/avaota
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
WorkingDirectory=/home/avaota
# Native systemd/PAM own the session. The established Qt, Chromium, Xorg and
# Mesa stack use their own loader in this compatibility filesystem.
RootDirectory=/opt/tono-runtime
MountAPIVFS=yes
PrivateMounts=yes
BindPaths=/home /run /tmp /dev
BindReadOnlyPaths=/etc/passwd /etc/group /etc/machine-id /etc/hosts /etc/default/tono-kiosk
# Runs as avaota inside the same root, mounts and service settings as Chromium.
# Failure stops startup rather than silently disabling Chromium's sandbox.
ExecStartPre=/usr/local/libexec/tono-sandbox-preflight
