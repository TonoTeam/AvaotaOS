# Installed as /etc/systemd/system/session-.scope.d/10-tono-kiosk.conf.
# PAM moves the kiosk's Xorg and app into a logind session scope. At shutdown
# that scope would otherwise stop in parallel with tono-kiosk.service and kill
# Xorg while the app saves. Every session scope, SSH included, stops after it.
[Unit]
Before=tono-kiosk.service
